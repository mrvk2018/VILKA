name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Склонировать репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Java (требуется для сборки Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Установить Flutter (используем стабильную версию из кэша)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Восстановить зависимости
      - name: Install dependencies
        run: flutter pub get

      # 5. Декодировать google-services.json из GitHub Secrets
      - name: Decode Google Services JSON
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$FIREBASE_SECRET" | base64 --decode > android/app/google-services.json

      # 6. Собрать Debug и Release APK с передачей API-ключа OpenRouter
      - name: Build Debug and Release APK
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build apk --debug --dart-define=OPENROUTER_API_KEY=$OPENROUTER_KEY
          flutter build apk --release --dart-define=OPENROUTER_API_KEY=$OPENROUTER_KEY

      # 7. Загрузить готовые артефакты (APK) в GitHub Actions Artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vilka-apks
          path: build/app/outputs/flutter-apk/app-*.apk
