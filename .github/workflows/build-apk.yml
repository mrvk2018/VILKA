name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Decode Google Services JSON
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$FIREBASE_SECRET" ]; then
            echo "::error::Secret FIREBASE_GOOGLE_SERVICES_BASE64 is not set in repository settings."
            exit 1
          fi
          echo "$FIREBASE_SECRET" | tr -d ' \n\r' | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json, sys
          path = "android/app/google-services.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
          except json.JSONDecodeError as e:
              print(f"::error::Invalid google-services.json after base64 decode: {e}")
              sys.exit(1)
          pkg = data["client"][0]["client_info"]["android_client_info"]["package_name"]
          expected = "com.vilka.teacher"
          if pkg != expected:
              print(f"::error::Firebase package_name is '{pkg}', expected '{expected}'")
              sys.exit(1)
          print(f"google-services.json OK (package_name={pkg})")
          PY

      - name: Build Debug and Release APK
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euxo pipefail
          flutter build apk --debug --dart-define=OPENROUTER_API_KEY="$OPENROUTER_KEY" 2>&1 | tee build-debug.log
          flutter build apk --release --dart-define=OPENROUTER_API_KEY="$OPENROUTER_KEY" 2>&1 | tee build-release.log

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vilka-apks
          path: build/app/outputs/flutter-apk/app-*.apk
